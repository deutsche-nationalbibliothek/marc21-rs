name: marc21-cli-release

on:
  push:
    tags:
      - "marc21-cli-[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  gh-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "VERSION=${TAG#marc21-cli-}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --verify-tag --draft --generate-notes --title "marc21-cli $VERSION"

  releases:
    needs: gh-release
    runs-on: ${{ matrix.target.os }}
    permissions:
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      matrix:
        target:
          - { os: ubuntu-latest, toolchain: stable, triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, toolchain: stable, triple: x86_64-unknown-linux-musl }
          - { os: windows-latest, toolchain: stable, triple: x86_64-pc-windows-msvc }
          - { os: macos-latest, toolchain: stable, triple: x86_64-apple-darwin }
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.target.toolchain }}
          targets: ${{ matrix.target.triple }}

      - name: Build release binary
        if: ${{ matrix.target.triple != 'x86_64-unknown-linux-musl' }}
        shell: bash
        run: |
          cargo build -p marc21-cli --release
          if [ "${{ matrix.target.os }}" = "windows-latest" ]; then
            echo "BINARY=target/release/marc21.exe" >> $GITHUB_ENV
          else
            echo "BINARY=target/release/marc21" >> $GITHUB_ENV
          fi
          
      - name: Build release binary (musl)
        if: ${{ matrix.target.triple == 'x86_64-unknown-linux-musl' }}
        shell: bash
        run: |
          sudo apt-get install -y musl-tools
          cargo build -p marc21-cli --target=x86_64-unknown-linux-musl --release
          echo "BINARY=target/x86_64-unknown-linux-musl/release/marc21" >> $GITHUB_ENV

      - name: Test package
        run: |
          cargo test --release -p marc21-cli
          cargo test --release -p marc21

      - name: Strip release binary
        shell: bash
        if: matrix.target.os == 'macos-latest'
        run: |
          strip "$BINARY"

      - name: Prepare archive
        shell: bash
        env:
          VERSION: ${{ needs.gh-release.outputs.version }}
          TRIPLE: ${{ matrix.target.triple }}
        run: |
          version="${VERSION}"
          triple="${TRIPLE}"
          ARCHIVE="marc21-$version-$triple"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          cargo run -F build -- build-man -o "$ARCHIVE/doc"
          cp "$BINARY" "$ARCHIVE"/
          cp "README.md" "$ARCHIVE"/
          cp "LICENSE" "$ARCHIVE"/

      - name: Build Archive (Windows)
        if: ${{ matrix.target.os == 'windows-latest' }}
        shell: bash
        run: |
          7z a "$ARCHIVE.zip" "$ARCHIVE"
          echo "ASSET=$ARCHIVE.zip" >> $GITHUB_ENV

      - name: Build Archive (Unix)
        if: ${{ matrix.target.os != 'windows-latest' }}
        shell: bash
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV

      - name: Generate artifact attestations
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: '${{ github.workspace }}/${{ env.ASSET }}'

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release upload "${TAG}" "${ASSET}"

  publish:
    needs:
      - gh-release
      - releases
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get crates.io access token
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p marc21-cli
