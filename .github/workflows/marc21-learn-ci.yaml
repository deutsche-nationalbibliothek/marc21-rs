name: marc21-learn

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '00 02 * * *'

permissions: {}


jobs:
  test:
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        working-directory: py/marc21-learn
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: ubuntu-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.15" }
          - { os: macos-latest, python-version: "3.15" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
            python-version: ${{ matrix.target.python-version }}
            
      - name: Setup project environment
        run: uv sync --locked --all-extras --dev

      - name: Run pytest
        run: uv run pytest tests

      - name: Run doctest
        run: make -C ./doc doctest


  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py/marc21-learn
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        
      - name: Setup project environment
        run: uv sync --locked --all-extras --dev
        
      - name: Run ruff
        run: uv run ruff check --output-format=github .

  ty:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py/marc21-learn
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        
      - name: Setup project environment
        run: uv sync --locked --all-extras --dev
        
      - name: Run ty
        run: uv run ty check --output-format=github .

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py/marc21-learn
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        
      - name: Setup project environment
        run: uv sync --locked --all-extras --dev
        
      - name: Run audit
        env:
          UV_MALWARE_CHECK: "1"
        run: uv --preview-features audit-command audit

  conclusion:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - test
      - ruff
      - audit
      - ty
    steps:
      - name: Check for cancelled jobs
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1
      - name: Check for failed jobs
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          exit 1
      - name: Finish job
        run: |
          exit 0
