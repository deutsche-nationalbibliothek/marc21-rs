name: python

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '00 02 * * *'

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: ubuntu-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.15" }
          - { os: macos-latest, python-version: "3.15" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
            python-version: ${{ matrix.target.python-version }}
            
      - name: Setup project environment
        run: cd python && uv sync --locked --all-extras --dev

      - name: Run pytest
        run: cd python && uv run pytest tests

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        
      - name: Setup project environment
        run: cd python && uv sync --locked --all-extras --dev
        
      - name: Run ruff
        run: cd python && uv run ruff check --output-format=github .

  ty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        
      - name: Setup project environment
        run: cd python && uv sync --locked --all-extras --dev
        
      - name: Run ty
        run: cd python && uv run ty check --output-format=github .

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        
      - name: Setup project environment
        run: cd python && uv sync --locked --all-extras --dev
        
      - name: Run audit
        env:
          UV_MALWARE_CHECK: "1"
        run: |
          cd python && uv --preview-features audit-command audit

  conclusion:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - test
      - audit
      - ty
      - ruff
    steps:
      - name: Check for cancelled jobs
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1
      - name: Check for failed jobs
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          exit 1
      - name: Finish job
        run: |
          exit 0
