[workspace.package]
authors = ["Nico Wagner <n.wagner@dnb.de>"]
repository = "https://github.com/deutsche-nationalbibliothek/marc21-rs"
documentation = "https://deutsche-nationalbibliothek.github.io/marc21-rs/"
license = "EUPL-1.2"
rust-version = "1.93"
edition = "2024"

[workspace]
resolver = "3"
default-members = ["crates/marc21-cli"]
members = [
  "crates/marc21",
  "crates/marc21-cli",
  "crates/marc21-python",
  "py/marc21-learn",
]

[workspace.dependencies]
aho-corasick = { version = "1.1.5" }
anyhow = { version = "1.0.104" }
assert_cmd = { version = "2.2.2" }
assert_fs = { version = "1.1.4" }
bstr = { version = "1.13.1", features = [
  "std",
  "alloc",
], default-features = false }
clap_complete = { version = "4.6.11" }
clap_mangen = { version = "0.3.3" }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
csv = { version = "1.4.0" }
dvrf = { version = "0.1.0" }
flate2 = { version = "1.1.10", features = [
  "zlib-rs",
], default-features = false }
indicatif = { version = "0.18.6" }
predicates = { version = "3.1.4" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
rand = { version = "0.10.3" }
regex = { version = "1.13.1" }
serde_test = { version = "1.0.177" }
serde = { version = "1.0.229" }
sha2 = { version = "0.11.1" }
smallvec = { version = "1.16.4" }
sophia = { version = "0.10.0" }
strsim = { version = "0.11.1" }
toml = { version = "1.1.8", features = ["preserve_order"] }
trycmd = { version = "1.2.1" }
unicode-normalization = { version = "0.1.26" }
winnow = { version = "1.0.4" }

marc21 = { path = "crates/marc21", version = "0.7.0" }
marc21-python = { path = "crates/marc21-python", version = "0.2.0" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
